# PR verification for any TeamValue repo: the deterministic gate first, then the AI review.
#
# In the repo's pipeline:
#   resources:
#     repositories:
#       - repository: harness
#         type: git
#         name: TeamValue - AiHub/TeamValue.AiHub.GitHubCopilot
#         ref: refs/tags/<harness version>        # a tag can move; harnessCommit below is the real pin
#   jobs:
#     - job: Verify
#       condition: eq(variables['Build.Reason'], 'PullRequest')
#       pool: { vmImage: ubuntu-latest }
#       variables:
#         - group: teamvalue.harness             # AnthropicApiKey (secret)
#       steps:
#         - template: infra/pipelines/ai-review.yml@harness
#           parameters:
#             harnessCommit: <full commit SHA of that tag>
#             claudeCodeVersion: <exact npm version of @anthropic-ai/claude-code>
#
# The job holds no service connection: the reviewer reads untrusted PR content (SEC.1) and can only
# Read/Grep/Glob. The build service needs "Contribute to pull requests" on the repo to post threads.
# The harness is never copied into the repo: it is checked out next to it at the pinned commit and linked as
# .harness/ for this run. Blocking: the pin, verify and the scenario check. Advisory: the AI review.

parameters:
  - name: harnessCommit
    type: string
  - name: verifyCommand
    type: string
    default: ./scripts/verify.sh
  - name: scenarioConfig
    type: string
    default: .harness-scenarios.json
  - name: claudeCodeVersion
    type: string
  - name: verificationTimeoutSeconds
    type: number
    default: 1800
  - name: code5Symbols
    type: object
    default: []
  - name: keyVaultPilots
    type: object
    default: []
  - name: aiReview
    type: boolean
    default: true

steps:
  - checkout: self
    path: s/repo
    fetchDepth: 0
  - checkout: harness
    path: s/harness

  - bash: |
      set -euo pipefail
      actual="$(git -C ../harness rev-parse HEAD)"
      [[ "$actual" == "${{ parameters.harnessCommit }}" ]] || {
        echo "harness is at $actual, the pipeline pins ${{ parameters.harnessCommit }}" >&2
        exit 1
      }
      ln -sfn ../harness/harness .harness
      echo "${{ parameters.harnessCommit }}" >"$(Agent.TempDirectory)/harness-commit"
    displayName: "Harness at the pinned commit"
    workingDirectory: $(Pipeline.Workspace)/s/repo

  - bash: |
      set -euo pipefail
      mkdir -p "$(Agent.TempDirectory)/review"
      target="origin/${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
      git merge-base "$target" HEAD >"$(Agent.TempDirectory)/review/base.txt"
      git diff --name-only "$target"...HEAD >"$(Agent.TempDirectory)/review/changed.txt"
      git diff "$target"...HEAD >"$(Agent.TempDirectory)/review/diff.patch"
      project="$(jq -rn --arg p "$SYSTEM_TEAMPROJECT" '$p | @uri')"
      curl -sSf -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
        "${SYSTEM_COLLECTIONURI%/}/$project/_apis/git/repositories/$BUILD_REPOSITORY_ID/pullRequests/$SYSTEM_PULLREQUEST_PULLREQUESTID?api-version=7.1" |
        jq -r '.description // ""' >"$(Agent.TempDirectory)/review/pr.txt"
      echo "$(wc -l <"$(Agent.TempDirectory)/review/changed.txt") changed file(s)"
    displayName: "Collect the change"
    workingDirectory: $(Pipeline.Workspace)/s/repo
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - bash: python3 -I .harness/tools/verification/install-tools.py --out "$(Agent.TempDirectory)/check-tools"
    displayName: "Install pinned check tools"
    workingDirectory: $(Pipeline.Workspace)/s/repo

  - bash: |
      python3 -I .harness/tools/verification/verify.py gitleaks --repo . --stage ci \
        --baseline "$(cat "$(Agent.TempDirectory)/review/base.txt")" \
        --tools "$(Agent.TempDirectory)/check-tools" --out "$(Agent.TempDirectory)/verification/secrets"
    displayName: "Gitleaks, PR commit range"
    workingDirectory: $(Pipeline.Workspace)/s/repo

  - ${{ each pilot in parameters.keyVaultPilots }}:
      - bash: |
          args=(--repo . --stage ci --tools "$(Agent.TempDirectory)/check-tools" \
            --template "$VAULT_TEMPLATE" --out "$VAULT_OUTPUT")
          [[ -z "$VAULT_PARAMETERS" ]] || args+=(--parameters "$VAULT_PARAMETERS")
          python3 -I .harness/tools/verification/verify.py psrule "${args[@]}"
        displayName: "PSRule Key Vault pilot: ${{ pilot.name }}"
        workingDirectory: $(Pipeline.Workspace)/s/repo
        env:
          VAULT_TEMPLATE: ${{ pilot.template }}
          VAULT_PARAMETERS: ${{ coalesce(pilot.parameters, '') }}
          VAULT_OUTPUT: $(Agent.TempDirectory)/verification/psrule-${{ pilot.name }}

  - bash: |
      python3 -I .harness/tools/verification/verify.py run --repo . --stage ci \
        --timeout "${{ parameters.verificationTimeoutSeconds }}" --requirement T.1.verify-command --out "$(Agent.TempDirectory)/verification/command" \
        -- bash -c "$VERIFY_COMMAND"
    displayName: "Verify (T.1), with execution evidence"
    workingDirectory: $(Pipeline.Workspace)/s/repo
    env:
      VERIFY_COMMAND: ${{ parameters.verifyCommand }}
      HARNESS_CODE5_EXTERNAL: "1"

  - bash: |
      args=(--repo . --stage ci --baseline "$(cat "$(Agent.TempDirectory)/review/base.txt")" \
        --out "$(Agent.TempDirectory)/verification/code-types")
      if [[ -n "$CODE5_SYMBOLS" ]]; then
        IFS=';' read -r -a configurations <<<"$CODE5_SYMBOLS"
        for configuration in "${configurations[@]}"; do args+=(--symbols "$configuration"); done
      fi
      python3 -I .harness/tools/verification/verify.py code-types "${args[@]}"
    displayName: "C# layout against PR baseline (CODE.5)"
    condition: succeededOrFailed()
    workingDirectory: $(Pipeline.Workspace)/s/repo
    env:
      CODE5_SYMBOLS: ${{ join(';', parameters.code5Symbols) }}

  - bash: |
      python3 -I .harness/tools/verification/verify.py report \
        --out "$(Agent.TempDirectory)/verification/receipt.json" \
        --required T.1.verify-command CODE.5.file-layout SEC.2.secret-scan --review CODE.5.responsibility \
        --results "$(Agent.TempDirectory)/verification/command/receipt.json" \
        "$(Agent.TempDirectory)/verification/code-types/receipt.json" \
        "$(Agent.TempDirectory)/verification/secrets/receipt.json"
    displayName: "Verification receipt, semantic review remains separate"
    condition: succeededOrFailed()
    workingDirectory: $(Pipeline.Workspace)/s/repo

  - publish: $(Agent.TempDirectory)/verification
    artifact: harness-verification
    displayName: "Publish verification evidence, including failures"
    condition: always()

  - bash: |
      python3 .harness/tools/testing/check-scenarios.py --config "${{ parameters.scenarioConfig }}" \
        --description "$(Agent.TempDirectory)/review/pr.txt" <"$(Agent.TempDirectory)/review/changed.txt"
    displayName: "Scenario for changed behaviour (T.5)"
    workingDirectory: $(Pipeline.Workspace)/s/repo

  - bash: |
      args=(--description "$(Agent.TempDirectory)/review/pr.txt")
      for receipt in "$(Agent.TempDirectory)"/verification/psrule-*/receipt.json; do
        [[ ! -f "$receipt" ]] || args+=(--psrule-receipt "$receipt")
      done
      python3 .harness/tools/iac/check-iac.py "${args[@]}" \
        <"$(Agent.TempDirectory)/review/changed.txt"
    displayName: "IaC settings (IAC.2, IAC.3, IAC.4)"
    workingDirectory: $(Pipeline.Workspace)/s/repo

  - ${{ if eq(parameters.aiReview, true) }}:
      - bash: |
          set -euo pipefail
          r="$(Agent.TempDirectory)/review"
          npm install --global "@anthropic-ai/claude-code@${{ parameters.claudeCodeVersion }}" >/dev/null
          .harness/tools/review/review.sh "$r"
          .harness/tools/azure-devops/ado-post-findings.sh "$r/findings.json"
          usage="$(cat "$r/usage.json" 2>/dev/null || echo null)"   # tokens, cost, time (ADR 0007); null if the engine wrote none
          jq -n --arg harness "$(cat "$(Agent.TempDirectory)/harness-commit")" --slurpfile sel "$r/selected.json" --slurpfile f "$r/findings.json" \
            --argjson usage "$usage" \
            '{harness: $harness, rules: ($sel[0].rules | to_entries | map(.value)), findings: ($f[0] | length),
              blockers: ($f[0] | map(select(.severity == "blocker")) | length), usage: $usage}' >"$r/receipt.json"
          cat "$r/receipt.json"
        displayName: "AI review (advisory)"
        workingDirectory: $(Pipeline.Workspace)/s/repo
        continueOnError: true
        env:
          ANTHROPIC_API_KEY: $(AnthropicApiKey)
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - publish: $(Agent.TempDirectory)/review
        artifact: harness-review
        displayName: "Publish review receipt"
        condition: always()

  # Leave nothing behind, also on self-hosted agents and after a failed step: the repo never holds the harness.
  - bash: rm -rf "$(Pipeline.Workspace)/s/repo/.harness" "$(Pipeline.Workspace)/s/harness"
    displayName: "Remove the harness checkout"
    condition: always()
